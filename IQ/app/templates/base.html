<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contract-IQ</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #10a37f;
            --primary-light: #1abc9c;
            --primary-dark: #0d8c6f;
            --sidebar-bg: #202123;
            --chat-bg: #444654;
            --user-msg-bg: #343541;
            --bot-msg-bg: #444654;
            --text-primary: #ffffff;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --border-color: #4b5563;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--sidebar-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: var(--sidebar-bg) !important;
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 1rem;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(to right, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand i {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-nav {
            gap: 10px;
        }

        .nav-link {
            color: var(--text-secondary) !important;
            padding: 8px 16px !important;
            border-radius: var(--radius);
            transition: var(--transition);
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--text-primary) !important;
            background: var(--primary-color);
        }

        .nav-link i {
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .container-fluid.content {
            padding: 0;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        /* Table styling for obligations and renewals pages */
        .table-dark {
            background: var(--sidebar-bg);
            border-color: var(--border-color);
        }

        .table-dark th {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-color: var(--border-color);
            color: white;
            font-weight: 600;
        }

        .table-dark td {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .table-dark tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .card {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--primary-light));
            border: none;
            color: white;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: linear-gradient(to right, var(--primary-light), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius);
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .badge {
            font-weight: 500;
            padding: 5px 10px;
        }

        .bg-success {
            background-color: var(--success-color) !important;
        }

        .bg-warning {
            background-color: var(--warning-color) !important;
        }

        .bg-danger {
            background-color: var(--error-color) !important;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-brain-circuit"></i>
                Contract-IQ
            </a>

            <div class="navbar-nav">
                <a class="nav-link {% if active_tab == 'chat' %}active{% endif %}" href="/">
                    <i class="fas fa-comments"></i>Contract-IQ
                </a>
                <a class="nav-link {% if active_tab == 'obligations' %}active{% endif %}" href="/obligations/">
                    <i class="fas fa-tasks"></i>Obligations
                </a>
                <a class="nav-link {% if active_tab == 'renewals' %}active{% endif %}" href="/renewals/">
                    <i class="fas fa-calendar-alt"></i>Renewals
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
